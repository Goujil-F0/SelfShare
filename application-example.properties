spring.application.name=SelfShare
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/selfshare_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your_mailtrap_username
spring.mail.password=your_mailtrap_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

selfshare.admin.username=admin
selfshare.admin.password=choose_a_strong_password
