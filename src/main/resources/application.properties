spring.application.name=SelfShare
server.port=8081

# --- Database configuration ---
spring.datasource.url=${SELFSHARE_DB_URL:jdbc:mysql://localhost:3306/selfshare_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SELFSHARE_DB_USERNAME:root}
spring.datasource.password=${SELFSHARE_DB_PASSWORD:}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SELFSHARE_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Encoding ---
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# File upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail configuration
spring.mail.host=${SELFSHARE_MAIL_HOST:localhost}
spring.mail.port=${SELFSHARE_MAIL_PORT:1025}
spring.mail.username=${SELFSHARE_MAIL_USERNAME:}
spring.mail.password=${SELFSHARE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin account
selfshare.admin.username=${SELFSHARE_ADMIN_USERNAME:admin}
selfshare.admin.password=${SELFSHARE_ADMIN_PASSWORD:change-me}
